<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>SMOKE TEST</title></head>
<body><pre id="log">running...</pre>
<script>
/* ============================================================
 * smoke-test.html — 红利工具冒烟测试（大师第十一轮规格）
 * 真 DOM 引擎：headless Chromium 跑真实 index.html（iframe 同源驱动）
 * 断言：状态栏无错误文本 / iframe onerror 零捕获 / tab 循环 / URL 回放 / localStorage 损坏恢复
 * 输出一行结论：SMOKE PASS vX.Y.Z
 * ============================================================ */
const logEl = document.getElementById('log');
const log = [];
const ok = (msg) => { log.push('✅ ' + msg); logEl.textContent = log.join('\n'); };
const fail = (msg) => { log.push('❌ ' + msg); logEl.textContent = log.join('\n'); };
let errors = [];

const iframe = document.createElement('iframe');
iframe.style.width = '390px'; iframe.style.height = '700px';
iframe.style.border = 'none';
document.body.appendChild(iframe);

function iframeDoc() { return iframe.contentDocument || iframe.contentWindow.document; }
function statusText() {
  const d = iframeDoc();
  const el = d && d.getElementById('status');
  return el ? el.textContent : '';
}
function pageErrors() {
  const d = iframeDoc();
  const els = d ? d.querySelectorAll('.status.err') : [];
  return Array.from(els).map(e => e.textContent).join(' | ');
}
const wait = ms => new Promise(r => setTimeout(r, ms));

async function loadIndex(src, timeoutMs) {
  errors = [];
  const w = iframe.contentWindow;
  w.onerror = (msg) => { errors.push(msg); };
  w.addEventListener('unhandledrejection', e => { errors.push('unhandledrejection: ' + (e.reason && e.reason.message || e.reason)); });
  iframe.src = src;
  const t0 = Date.now();
  while (Date.now() - t0 < timeoutMs) {
    await wait(500);
    const s = statusText();
    if (s && s.includes('演示数据') || s && s.includes('✅ 完成')) break;
  }
}

(async function () {
  try {
    // 场景0：预置损坏 localStorage（防崩溃恢复测试）
    try { localStorage.setItem('divtool_params', '{bad json!!!'); localStorage.setItem('divtool_watchlist_v1', 'not-json'); } catch (e) { }
    log.push('场景0: 预置损坏 localStorage');

    // 场景1：默认加载 → demo 回测自动跑
    await loadIndex('index.html', 25000);
    const s1 = statusText();
    if (s1.includes('演示数据')) ok('场景1 demo回测渲染: ' + s1.slice(0, 40));
    else fail('场景1 demo回测失败: ' + s1);
    const pe1 = pageErrors();
    if (pe1) fail('场景1 状态栏错误: ' + pe1); else ok('场景1 状态栏无错误');
    if (errors.length) fail('场景1 JS错误: ' + errors.join('; ')); else ok('场景1 无JS错误');

    // 场景2：URL 参数回放（s bug 案发现场）+ 每月追加
    await loadIndex('index.html?code=600036&m=10000&d=2020-01-01&p=500000&r=1', 40000);
    const s2 = statusText();
    if (s2.includes('✅ 完成') || s2.includes('演示数据') || s2.includes('回退')) ok('场景2 URL回放完成: ' + s2.slice(0, 50));
    else fail('场景2 URL回放失败: ' + s2);
    const pe2 = pageErrors();
    if (pe2) fail('场景2 状态栏错误: ' + pe2); else ok('场景2 状态栏无错误');
    if (errors.length) fail('场景2 JS错误: ' + errors.join('; ')); else ok('场景2 无JS错误');
    const mVal = iframeDoc().getElementById('monthly');
    if (mVal && mVal.value === '10000') ok('场景2 每月追加参数恢复: ' + mVal.value);
    else fail('场景2 monthly 未恢复: ' + (mVal ? mVal.value : '无元素'));

    // 场景3：tab 切换循环 ×2（dispose/重复init 类 bug）
    await loadIndex('index.html', 20000);
    let tabErr = [];
    for (let round = 0; round < 2; round++) {
      for (const t of ['home', 'diagnose', 'compare', 'backtest']) {
        const btn = iframeDoc().querySelector('.tabbar button[data-tab="' + t + '"]');
        if (!btn) { tabErr.push('无tab按钮:' + t); continue; }
        btn.click();
        await wait(300);
      }
    }
    if (tabErr.length) fail('场景3 tab切换: ' + tabErr.join(';'));
    else ok('场景3 tab循环×2 无异常');
    if (errors.length) fail('场景3 JS错误: ' + errors.join('; ')); else ok('场景3 无JS错误');

    // 场景4：自选损坏恢复（watchlist 坏 JSON → 页面不崩）
    const homeBtn = iframeDoc().querySelector('.tabbar button[data-tab="home"]');
    if (homeBtn) homeBtn.click();
    await wait(2500);   // 等决策台异步渲染完成
    const wl = iframeDoc().getElementById('homeWatchlist');
    if (wl && (wl.textContent.includes('还没有自选') || wl.textContent.includes('添加自选'))) ok('场景4 自选损坏恢复为空态');
    else fail('场景4 自选状态异常: ' + (wl ? wl.textContent.slice(0, 60) : '无元素'));

    // 场景5（v1.7.6 M11 移动端回归）：390px 视口下对比页三栏不溢出 + 周期按钮可点（防手机布局回退）
    const cmpBtn = iframeDoc().querySelector('.tabbar button[data-tab="compare"]');
    if (cmpBtn) cmpBtn.click();
    await wait(1500);
    const cmpFields = iframeDoc().querySelectorAll('#cmpControls .field, #cmpControls input, #cmpControls select');
    const overflow = Array.from(cmpFields).some(el => el.getBoundingClientRect().right > 390 || el.getBoundingClientRect().left < 0);
    if (overflow) fail('场景5 对比页元素超出 390px 视口');
    else ok('场景5 对比页 390px 布局无溢出');
    const yBtn = iframeDoc().querySelector('#cmpYears button');
    if (yBtn) { yBtn.click(); ok('场景5 周期按钮可点'); } else fail('场景5 周期按钮缺失');
    if (errors.length) fail('场景5 JS错误: ' + errors.join('; ')); else ok('场景5 无JS错误');

    // 场景6（v1.7.6 大师发版条件）：ETF 数据源限制标注真实触发（搜索 512890 进诊断 + 回测 tab 跑 ETF）
    // 6a：诊断页——搜索框输入 512890 回车 → openDiagnose 渲染后 diagEtfNote 应显示
    const search = iframeDoc().getElementById('homeSearch');
    if (search) {
      search.value = '512890';
      search.dispatchEvent(new iframe.contentWindow.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    }
    const t6a = Date.now();
    while (Date.now() - t6a < 30000) {
      await wait(800);
      const dEtf = iframeDoc().getElementById('diagEtfNote');
      if (dEtf && dEtf.textContent.includes('数据源限制')) break;
    }
    const dEtf = iframeDoc().getElementById('diagEtfNote');
    if (dEtf && dEtf.textContent.includes('数据源限制')) ok('场景6 诊断页ETF标注含“数据源限制”');
    else fail('场景6 诊断页ETF标注未出现: ' + (dEtf ? dEtf.textContent.slice(0, 50) : '无元素'));
    // 6b：回测页——code 输入 512890 点回测 → renderAll 后 btEtfNote 应显示
    const codeInp = iframeDoc().getElementById('code');
    const runBtn = iframeDoc().getElementById('btnRun');
    if (codeInp && runBtn) {
      codeInp.value = '512890';
      runBtn.click();
    }
    const t6b = Date.now();
    while (Date.now() - t6b < 45000) {
      await wait(1000);
      const bEtf = iframeDoc().getElementById('btEtfNote');
      if (bEtf && bEtf.textContent.includes('数据源限制')) break;
      const st = statusText();
      if (st && (st.includes('回退') || st.includes('出错'))) break;
    }
    const bEtf = iframeDoc().getElementById('btEtfNote');
    if (bEtf && bEtf.textContent.includes('数据源限制')) ok('场景6 回测页ETF标注含“数据源限制”');
    else fail('场景6 回测页ETF标注未出现: ' + (bEtf ? bEtf.textContent.slice(0, 50) : '无元素') + ' | 状态:' + statusText().slice(0, 60));
    if (errors.length) fail('场景6 JS错误: ' + errors.join('; ')); else ok('场景6 无JS错误');

    // 结论
    const hasFail = log.some(l => l.startsWith('❌'));
    logEl.textContent = (hasFail ? 'SMOKE FAIL' : 'SMOKE PASS') + ' v1.7.6 ' + location.origin + '\n' + log.join('\n');
  } catch (e) {
    logEl.textContent = 'SMOKE ERROR: ' + e.message + '\n' + log.join('\n');
  }
})();
</script>
</body></html>
